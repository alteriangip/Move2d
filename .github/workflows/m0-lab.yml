# Milestone 0 lab: unit tests on every push; optional GitHub Pages deployment
# (needed for Home Screen / standalone tests — enable Pages with source
# "GitHub Actions" in the repository settings, then run this workflow).
name: m0-lab
on:
  push:
    paths: ['spikes/m0-lab/**', '.github/workflows/m0-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: m0-lab-pages, cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: spikes/m0-lab } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: spikes/m0-lab/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with: { path: spikes/m0-lab/dist-pages }
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
