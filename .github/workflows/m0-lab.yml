# Milestone 0 lab (archived spike): unit tests only.
name: m0-lab
on:
  push:
    paths: ['spikes/m0-lab/**', '.github/workflows/m0-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: spikes/m0-lab } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: spikes/m0-lab/package-lock.json }
      - run: npm ci
      - run: npm test
