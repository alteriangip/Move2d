# OpenLive app: unit tests + build on every push. Run manually ("Run workflow")
# to deploy the installable PWA to GitHub Pages (enable Pages with source
# "GitHub Actions" in the repository settings first).
name: app
on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: app-pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist-pages }
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
