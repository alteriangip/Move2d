# Generate the Xcode project with: brew install xcodegen && cd App && xcodegen
name: Move2D
options:
  bundleIdPrefix: app.move2d
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Move2DKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Move2D:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes: ["Info.plist"]
    dependencies:
      - package: Move2DKit
        product: M2DEditor
      - package: Move2DKit
        product: M2DMetal
      - package: Move2DKit
        product: M2DExport
      - package: Move2DKit
        product: M2DProject
      - package: Move2DKit
        product: M2DPSD
      - package: Move2DKit
        product: M2DRender
      - package: Move2DKit
        product: M2DRig
      - package: Move2DKit
        product: M2DAnimation
      - package: Move2DKit
        product: M2DPhysics
      - package: Move2DKit
        product: M2DCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.move2d.studio
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
schemes:
  Move2D:
    build:
      targets:
        Move2D: all
